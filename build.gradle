import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    ext.kotlin_version = '1.1.4'

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'base'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'kotlin'

group = 'de.framework-test'
version = '0.1b'

sourceCompatibility = 1.8
targetCompatibility = 1.8

task copyFrameworkPlugin(dependsOn: jar) {
    doLast {
        copy {
           from "$buildDir/libs"
           into project(':Framework').buildDir.getAbsolutePath() + "/../server/framework-plugins"
       }
    }

    mustRunAfter(':Framework:copyPlugins')
}

idea {
    module {
        name = 'VoxelEdit'
        jdkName = '1.8'

        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
    jcenter()

    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }

    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }

    maven {
        name = 'exposed'
        url 'http://dl.bintray.com/kotlin/exposed'
    }
}

dependencies {
    compile('org.spigotmc:spigot-api:1.12-R0.1-SNAPSHOT') {
        transitive = true
    }

//    compile project(path: ':Framework', configuration: 'api')
    compile project(path: ':Framework')

    compile "org.jetbrains.kotlin:kotlin-stdlib-jre8:$kotlin_version"
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

jar {
    include 'de/sakul6499/**'
        from('src/main/resources') {
            include '**'
    }
}

/* Version */
processResources {
    def version = 'git log -1 HEAD --pretty=format:"%H %aD - %cn >> %s"'.execute().text.trim()
    println "Building Version: " + version
    filter(ReplaceTokens, tokens: ['version': version])
}
